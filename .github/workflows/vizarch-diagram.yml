# vizarch — GitHub Action: Generate architecture diagram from PR description
# Triggers on PR open/update. Reads PR body, sends to vizarch API, comments SVG.
name: vizarch — Architecture Diagram

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  generate-diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate diagram from PR description
        env:
          VIZARCH_URL: ${{ secrets.VIZARCH_URL || 'https://vizarch.app' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Generating architecture diagram from PR #$PR_NUMBER..."
          
          # Extract architecture description (between ```vizarch and ``` blocks, or use full body)
          DESC=$(echo "$PR_BODY" | sed -n '/```vizarch/,/```/p' | head -n -1 | tail -n +2)
          if [ -z "$DESC" ]; then
            DESC="$PR_BODY"
          fi
          
          # Truncate to 4000 chars
          DESC=$(echo "$DESC" | head -c 4000)
          
          # Generate diagram
          RESPONSE=$(curl -sS -X POST "$VIZARCH_URL/api/v1/generate" \
            -H "Content-Type: application/json" \
            -d "{\"description\": $(echo "$DESC" | jq -Rs .), \"style\": {\"layout\": \"horizontal\", \"theme\": \"light\"}}")
          
          SVG=$(echo "$RESPONSE" | jq -r '.svg // empty')
          if [ -z "$SVG" ]; then
            echo "No SVG in response. Raw: $RESPONSE"
            exit 0
          fi
          
          # Save SVG
          echo "$SVG" > architecture.svg
          
          # Comment on PR
          COMMENT_BODY=$(jq -n --arg svg "$SVG" '{body: "## 🏗️ Architecture Diagram\n\nGenerated by [vizarch](https://vizarch.app) from this PR's description.\n\n<details>\n<summary>View SVG diagram</summary>\n\n```svg\n\($svg)\n```\n\n</details>"}')
          
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -d "$COMMENT_BODY"
          
          echo "Diagram commented on PR #$PR_NUMBER"
